<!doctype html>
<meta charset="utf-8">
<title>M0 probe</title>
<body>
<script>
/* M0 probe — proves the production GPGPU shape per spec rev 3, Boot §1.
   Reports window.M0 = { pass, env, checks: [{name, ok, detail}] }. */
(function () {
  var checks = [];
  function check(name, ok, detail) { checks.push({ name: name, ok: !!ok, detail: detail || "" }); return ok; }
  function done() {
    window.M0 = {
      pass: checks.every(function (c) { return c.ok; }),
      env: env,
      checks: checks
    };
  }
  var env = {};

  function makeProbeCanvas() {
    var c = document.createElement("canvas");
    c.width = 8; c.height = 8;
    return c;
  }

  var N = 4; // spec: probe at 4x4

  function compile(gl, type, src) {
    var s = gl.createShader(type);
    gl.shaderSource(s, src);
    gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
      throw new Error("shader: " + gl.getShaderInfoLog(s));
    }
    return s;
  }
  function link(gl, vs, fs) {
    var p = gl.createProgram();
    gl.attachShader(p, compile(gl, gl.VERTEX_SHADER, vs));
    gl.attachShader(p, compile(gl, gl.FRAGMENT_SHADER, fs));
    gl.linkProgram(p);
    if (!gl.getProgramParameter(p, gl.LINK_STATUS)) {
      throw new Error("link: " + gl.getProgramInfoLog(p));
    }
    return p;
  }

  var QUAD_VS = "#version 300 es\nvoid main(){vec2 v=vec2(gl_VertexID==1?3.0:-1.0,gl_VertexID==2?3.0:-1.0);gl_Position=vec4(v,0.,1.);}";

  var SIM_FS = [
    "#version 300 es",
    "precision highp float;",
    "uniform sampler2D uPos, uVel;",
    "uniform float uDt;",
    "layout(location=0) out vec4 oPos;",
    "layout(location=1) out vec4 oVel;",
    "void main(){",
    "  ivec2 c = ivec2(gl_FragCoord.xy);",
    "  vec4 p = texelFetch(uPos, c, 0);",
    "  vec4 v = texelFetch(uVel, c, 0);",
    // deterministic update using fragment-derived id (spec: no gl_VertexID here)
    "  float id = float(c.y * " + N + " + c.x);",
    "  vec3 nv = v.xyz * 0.5 + vec3(1.0, 2.0, id) * uDt;",
    "  vec3 np = p.xyz + nv * uDt;",
    "  oPos = vec4(np, p.w);",
    "  oVel = vec4(nv, v.w);",
    "}"
  ].join("\n");

  var REN_VS = [
    "#version 300 es",
    "uniform sampler2D uPos;",
    "uniform int uN;",
    "void main(){",
    "  ivec2 c = ivec2(gl_VertexID % uN, gl_VertexID / uN);",
    "  vec4 p = texelFetch(uPos, c, 0);",
    "  gl_Position = vec4(p.xy, 0.0, 1.0);",
    "  gl_PointSize = 1.0;",
    "}"
  ].join("\n");
  var REN_FS = "#version 300 es\nprecision highp float;out vec4 o;void main(){o=vec4(1.0,0.25,0.0,1.0);}";

  var COPY_FS = [
    "#version 300 es",
    "precision highp float;",
    "uniform sampler2D uT;",
    "out vec4 o;",
    "void main(){ o = texelFetch(uT, ivec2(gl_FragCoord.xy), 0); }"
  ].join("\n");

  function makeTexF(gl, internal, n, data, type) {
    var t = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, t);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    gl.texImage2D(gl.TEXTURE_2D, 0, internal, n, n, 0, gl.RGBA, type, data || null);
    return t;
  }

  function runProbeCycle(cycle) {
    var canvas = makeProbeCanvas();
    var gl = canvas.getContext("webgl2", { antialias: false });
    if (!check("c" + cycle + ":webgl2-context", !!gl)) return false;

    if (cycle === 0) {
      var dbg = gl.getExtension("WEBGL_debug_renderer_info");
      env.renderer = dbg ? gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL) : gl.getParameter(gl.RENDERER);
      env.version = gl.getParameter(gl.VERSION);
      env.glsl = gl.getParameter(gl.SHADING_LANGUAGE_VERSION);
    }

    var ext = gl.getExtension("EXT_color_buffer_float");
    if (!check("c" + cycle + ":EXT_color_buffer_float", !!ext)) return false;

    var owned = { tex: [], fbo: [], prog: [] };
    function track(kind, x) { owned[kind].push(x); return x; }

    try {
      // ── state textures, production formats ──
      var pos0 = new Float32Array(N * N * 4), vel0 = new Float32Array(N * N * 4);
      for (var i = 0; i < N * N; i++) {
        pos0[i * 4 + 0] = i * 0.01;      // x
        pos0[i * 4 + 1] = -i * 0.01;     // y
        pos0[i * 4 + 2] = 0.5;           // z
        pos0[i * 4 + 3] = -2.0;          // DEPTH_FREE sentinel
        vel0[i * 4 + 3] = 0.0;           // grab flag
      }
      var pos = [track("tex", makeTexF(gl, gl.RGBA32F, N, pos0, gl.FLOAT)),
                 track("tex", makeTexF(gl, gl.RGBA32F, N, null, gl.FLOAT))];
      var vel = [track("tex", makeTexF(gl, gl.RGBA32F, N, vel0, gl.FLOAT)),
                 track("tex", makeTexF(gl, gl.RGBA32F, N, null, gl.FLOAT))];

      // ── MRT FBOs (2 attachments, the real layout), completeness both directions ──
      var fbos = [null, null];
      for (var d = 0; d < 2; d++) {
        fbos[d] = track("fbo", gl.createFramebuffer());
        gl.bindFramebuffer(gl.FRAMEBUFFER, fbos[d]);
        gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, pos[d], 0);
        gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT1, gl.TEXTURE_2D, vel[d], 0);
        gl.drawBuffers([gl.COLOR_ATTACHMENT0, gl.COLOR_ATTACHMENT1]);
        var status = gl.checkFramebufferStatus(gl.FRAMEBUFFER);
        if (!check("c" + cycle + ":fbo" + d + "-complete", status === gl.FRAMEBUFFER_COMPLETE, "status=0x" + status.toString(16))) return false;
      }

      // ── sim program + 3 steps through both ping-pong directions ──
      var simP = track("prog", link(gl, QUAD_VS, SIM_FS));
      var vao = gl.createVertexArray();
      gl.bindVertexArray(vao);
      gl.viewport(0, 0, N, N);
      gl.disable(gl.BLEND);
      gl.disable(gl.DEPTH_TEST);
      gl.useProgram(simP);
      gl.uniform1f(gl.getUniformLocation(simP, "uDt"), 1.0);
      var uPos = gl.getUniformLocation(simP, "uPos"), uVel = gl.getUniformLocation(simP, "uVel");
      gl.uniform1i(uPos, 0); gl.uniform1i(uVel, 1);

      var cur = 0;
      var STEPS = 3;
      for (var s = 0; s < STEPS; s++) {
        var nxt = 1 - cur;
        gl.bindFramebuffer(gl.FRAMEBUFFER, fbos[nxt]);
        gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, pos[cur]);
        gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, vel[cur]);
        gl.drawArrays(gl.TRIANGLES, 0, 3);
        cur = nxt;
      }

      // ── CPU mirror of the same update ──
      var ep = pos0.slice(), ev = vel0.slice();
      for (var s2 = 0; s2 < STEPS; s2++) {
        for (var j = 0; j < N * N; j++) {
          var nvx = ev[j * 4] * 0.5 + 1.0, nvy = ev[j * 4 + 1] * 0.5 + 2.0, nvz = ev[j * 4 + 2] * 0.5 + j;
          ev[j * 4] = nvx; ev[j * 4 + 1] = nvy; ev[j * 4 + 2] = nvz;
          ep[j * 4] += nvx; ep[j * 4 + 1] += nvy; ep[j * 4 + 2] += nvz;
        }
      }

      // ── readback each attachment, assert ──
      gl.bindFramebuffer(gl.FRAMEBUFFER, fbos[cur]);
      var got = new Float32Array(N * N * 4);
      var maxErr = 0, k;
      gl.readBuffer(gl.COLOR_ATTACHMENT0);
      gl.readPixels(0, 0, N, N, gl.RGBA, gl.FLOAT, got);
      for (k = 0; k < got.length; k++) maxErr = Math.max(maxErr, Math.abs(got[k] - ep[k]));
      if (!check("c" + cycle + ":sim-pos-values", maxErr < 1e-4, "maxErr=" + maxErr)) return false;
      var sentinelOK = true;
      for (k = 0; k < N * N; k++) if (got[k * 4 + 3] !== -2.0) sentinelOK = false;
      if (!check("c" + cycle + ":pos-w-sentinel-preserved", sentinelOK)) return false;

      maxErr = 0;
      gl.readBuffer(gl.COLOR_ATTACHMENT1);
      gl.readPixels(0, 0, N, N, gl.RGBA, gl.FLOAT, got);
      for (k = 0; k < got.length; k++) maxErr = Math.max(maxErr, Math.abs(got[k] - ev[k]));
      if (!check("c" + cycle + ":sim-vel-values", maxErr < 1e-4, "maxErr=" + maxErr)) return false;

      // ── vertex-stage texelFetch render: particle 0 at a known NDC spot ──
      var renderPosData = new Float32Array(N * N * 4);
      for (k = 0; k < N * N; k++) { renderPosData[k * 4] = 9.0; renderPosData[k * 4 + 1] = 9.0; } // offscreen
      renderPosData[0] = 0.125; renderPosData[1] = 0.125; // particle 0 → window (4.5,4.5) = center of pixel (4,4)
      var rTex = track("tex", makeTexF(gl, gl.RGBA32F, N, renderPosData, gl.FLOAT));
      var outTex = track("tex", makeTexF(gl, gl.RGBA8, 8, null, gl.UNSIGNED_BYTE));
      var outFbo = track("fbo", gl.createFramebuffer());
      gl.bindFramebuffer(gl.FRAMEBUFFER, outFbo);
      gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, outTex, 0);
      gl.drawBuffers([gl.COLOR_ATTACHMENT0]);
      if (!check("c" + cycle + ":render-fbo-complete", gl.checkFramebufferStatus(gl.FRAMEBUFFER) === gl.FRAMEBUFFER_COMPLETE)) return false;
      var renP = track("prog", link(gl, REN_VS, REN_FS));
      gl.viewport(0, 0, 8, 8);
      gl.clearColor(0, 0, 0, 1);
      gl.clear(gl.COLOR_BUFFER_BIT);
      gl.useProgram(renP);
      gl.uniform1i(gl.getUniformLocation(renP, "uPos"), 0);
      gl.uniform1i(gl.getUniformLocation(renP, "uN"), N);
      gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, rTex);
      gl.drawArrays(gl.POINTS, 0, N * N);
      var px = new Uint8Array(4);
      gl.readPixels(4, 4, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, px);
      if (!check("c" + cycle + ":vertex-texelFetch-render", px[0] === 255 && px[2] === 0, "center px=" + Array.from(px).join(","))) return false;

      // ── RGBA16F target: upload float data, sample it back through a copy pass ──
      var tData = new Float32Array(N * N * 4);
      for (k = 0; k < N * N * 4; k++) tData[k] = (k % 17) / 16 - 0.5;
      var tTex = track("tex", makeTexF(gl, gl.RGBA16F, N, tData, gl.FLOAT));
      var t32 = track("tex", makeTexF(gl, gl.RGBA32F, N, null, gl.FLOAT));
      var tFbo = track("fbo", gl.createFramebuffer());
      gl.bindFramebuffer(gl.FRAMEBUFFER, tFbo);
      gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, t32, 0);
      gl.drawBuffers([gl.COLOR_ATTACHMENT0]);
      var copyP = track("prog", link(gl, QUAD_VS, COPY_FS));
      gl.viewport(0, 0, N, N);
      gl.useProgram(copyP);
      gl.uniform1i(gl.getUniformLocation(copyP, "uT"), 0);
      gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, tTex);
      gl.drawArrays(gl.TRIANGLES, 0, 3);
      var tGot = new Float32Array(N * N * 4);
      gl.readBuffer(gl.COLOR_ATTACHMENT0);
      gl.readPixels(0, 0, N, N, gl.RGBA, gl.FLOAT, tGot);
      maxErr = 0;
      for (k = 0; k < tGot.length; k++) maxErr = Math.max(maxErr, Math.abs(tGot[k] - tData[k]));
      if (!check("c" + cycle + ":rgba16f-roundtrip", maxErr < 0.002, "maxErr=" + maxErr)) return false; // 16F quantization ≤ ~0.001 near 1

      if (!check("c" + cycle + ":no-gl-error", gl.getError() === gl.NO_ERROR)) return false;

      // ── explicit teardown of every application-owned resource ──
      owned.tex.forEach(function (t) { gl.deleteTexture(t); });
      owned.fbo.forEach(function (f) { gl.deleteFramebuffer(f); });
      owned.prog.forEach(function (p) { gl.deleteProgram(p); });
      gl.deleteVertexArray(vao);
      check("c" + cycle + ":teardown-clean", gl.getError() === gl.NO_ERROR);
      var lose = gl.getExtension("WEBGL_lose_context");
      if (lose) lose.loseContext();
      return true;
    } catch (e) {
      check("c" + cycle + ":exception", false, String(e));
      return false;
    }
  }

  // spec: destroy and recreate twice — three full cycles total
  for (var cycle = 0; cycle < 3; cycle++) {
    if (!runProbeCycle(cycle)) break;
  }
  done();
})();
</script>
